alias: 2. Testing Df actions - DF sequence of Operation - Full Cycle
description: ""
trigger:
  - platform: state
    entity_id: calendar.nuhome_df_test
    from: "off"
    to: "on"
    id: start_df_event
    alias: Calendar event for DF turns on
  - platform: state
    entity_id: input_boolean.df_event_status
    from: "off"
    to: "on"
    id: df_event_started
    alias: DF event started - take snapshot, restrict UI
  - platform: state
    entity_id: input_boolean.climate_snapshot
    from: "off"
    to: "on"
    id: take climate snapshot
    alias: Take snapshot of climate conditions prior to DF event
  - platform: state
    entity_id: input_boolean.smart_cities_set_point_changed_on_device
    to: "on"
    id: Occupant Overrides On Device
    from: "off"
  - platform: state
    entity_id: calendar.nuhome_df_test
    from: "on"
    to: "off"
    id: df_event_ended
    alias: Calendar event for DF turns off
  - platform: state
    entity_id: input_boolean.df_restriction_status
    from: "on"
    to: "off"
    id: Occupant Overrides In App
    alias: Occupant Override In App
  - platform: state
    entity_id: climate.office
    attribute: temperature
    alias: Occupant On Device Override - Target Temperature CHANGES
    id: Occupant On Device Override - Target Temperature
  - platform: state
    entity_id: climate.office
    attribute: target_temp_high
    alias: Occupant On Device Override - Target High Temp CHANGES
    id: Occupant On Device Override - Target High Temp
  - platform: state
    entity_id: climate.office
    attribute: target_temp_low
    alias: Occupant On Device Override - Target Low Temp CHANGES
    id: Occupant On Device Override - Target Low Temp
  - platform: state
    entity_id: input_boolean.set_df_conditions
    to: "on"
    id: Enable DF conditions
    from: "off"
action:
  - variables:
      t_delta: |-
        {% if is_state(df_calendar, 'on') %}
          {{ float((state_attr(df_calendar, 'description') | from_json)['T_delta'], 0)  }}
        {% else %}
          0
        {% endif %}
      season: |-
        {% if is_state(df_calendar, 'on') %}
          {{ (state_attr(df_calendar, 'description') | from_json)['season']  }}
        {% else %}
          {{ '' }}
        {% endif %}
      df_delta_multiplier: |-
        {% if is_state(df_calendar, 'on') %}
          {% if (state_attr(df_calendar, 'description') | from_json)['season'] == 'cooling' %}
            {{ float(1, 0) }}
          {% elif (state_attr(df_calendar, 'description') | from_json)['season'] == 'heating' %} 
            {{ float(-1, 0) }}
          {% else %}
              0
          {% endif %}
        {% endif %}
    alias: defines DF variables
  - alias: based on stages of automation stage, chooses which action to perform
    choose:
      - conditions:
          - condition: trigger
            id: start_df_event
        sequence:
          - action: input_boolean.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: input_boolean.df_event_status
        alias: Start DF event when calendar event is live
      - conditions:
          - condition: trigger
            id: df_event_started
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id:
                - input_boolean.df_restriction_status
                - input_boolean.climate_snapshot
            data: {}
        alias: Turns on snapshot, restriction booleans
      - conditions:
          - condition: and
            conditions:
              - condition: trigger
                id: take climate snapshot
              - condition: state
                entity_id: input_boolean.df_event_status
                state: "on"
            alias: Confirms DF event is on & snapshot is enabled
        sequence:
          - action: input_text.set_value
            metadata: {}
            data:
              value: "{{state_attr(real_thermostat, 'fan_mode')}}"
            target:
              entity_id: input_text.smart_cities_snapshot_fan_mode
          - action: input_text.set_value
            metadata: {}
            data:
              value: "{{ states(real_thermostat) }} "
            target:
              entity_id: input_text.smart_cities_snapshot_hvac_mode
          - action: input_text.set_value
            metadata: {}
            data:
              value: "{{ state_attr(real_thermostat, 'preset_mode')}}"
            target:
              entity_id: input_text.smart_cities_snapshot_preset_mode
          - action: input_text.set_value
            metadata: {}
            data:
              value: "{{ state_attr(real_thermostat, 'hvac_action')}}"
            target:
              entity_id: input_text.smart_cities_snapshot_hvac_action
          - choose:
              - conditions:
                  - condition: state
                    entity_id: climate.office
                    state: heat_cool
                    alias: Confirms the thermostat is in dual mode (heat_cool)
                sequence:
                  - action: input_text.set_value
                    metadata: {}
                    data:
                      value: >
                        {{ float(state_attr(real_thermostat,
                        'target_temp_low'),None) }}
                    target:
                      entity_id: input_text.smart_cities_snapshot_target_temp_low
                  - action: input_text.set_value
                    metadata: {}
                    data:
                      value: >
                        {{ float(state_attr(real_thermostat,
                        'target_temp_high'), None) }}
                    target:
                      entity_id: input_text.smart_cities_snapshot_target_temp_high
                  - action: input_text.set_value
                    metadata: {}
                    data:
                      value: |
                        {{ ' ' }}
                    target:
                      entity_id: input_text.smart_cities_snapshot_temperature
              - conditions:
                  - alias: Confirms the thermostat is in single mode (heat/cool)
                    condition: or
                    conditions:
                      - condition: state
                        entity_id: climate.office
                        state: heat
                      - condition: state
                        entity_id: climate.office
                        state: cool
                sequence:
                  - action: input_text.set_value
                    metadata: {}
                    data:
                      value: >
                        {{ float(state_attr(real_thermostat, 'temperature'),
                        None) }}
                    target:
                      entity_id: input_text.smart_cities_snapshot_temperature
                  - action: input_text.set_value
                    metadata: {}
                    data:
                      value: |
                        {{ ' ' }}
                    target:
                      entity_id: input_text.smart_cities_snapshot_target_temp_low
                  - action: input_text.set_value
                    metadata: {}
                    data:
                      value: |
                        {{ ' ' }}
                    target:
                      entity_id: input_text.smart_cities_snapshot_target_temp_high
            alias: Gets Thermostat set point(s) depending on the climate mode
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.set_df_conditions
            alias: Turns boolean on to set DF conditions next
            data: {}
        alias: Sets snapshot entities in helper texts
      - conditions:
          - condition: and
            conditions:
              - condition: trigger
                id:
                  - Enable DF conditions
              - condition: state
                entity_id: input_boolean.df_event_status
                state: "on"
              - condition: state
                entity_id: input_boolean.climate_snapshot
                state: "on"
              - condition: state
                entity_id: input_boolean.set_df_conditions
                state: "on"
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: climate.office
                    state: heat_cool
                sequence:
                  - action: climate.set_temperature
                    metadata: {}
                    data: |
                      {
                        "target_temp_high": {{ float(state_attr(snapshot_thermostat, 'target_temp_high')  + t_delta, None)}},
                        "target_temp_low": {{ float(state_attr(snapshot_thermostat, 'target_temp_low') - t_delta, None) }}
                      }
                    target:
                      entity_id: climate.office
                    alias: Sets Dual mode HVAC conditions
                  - delay:
                      hours: 0
                      minutes: 0
                      seconds: 5
                      milliseconds: 0
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.df_conditions_set
                    alias: Enable boolean to indicate DF conditions are set
                    data: {}
                alias: Confirms dual mode and offsets both setpoints
              - conditions:
                  - alias: Check HVAC mode is heating or cooling and DF season
                    condition: or
                    conditions:
                      - condition: and
                        conditions:
                          - condition: state
                            entity_id: climate.office
                            state: heat
                          - condition: template
                            value_template: "{{ season == 'heating'}} "
                      - condition: and
                        conditions:
                          - condition: state
                            entity_id: climate.office
                            state: cool
                          - condition: template
                            value_template: "{{ season == 'cooling'}} "
                sequence:
                  - action: climate.set_temperature
                    metadata: {}
                    data: |
                      {
                        "temperature": {{ float(state_attr(snapshot_thermostat, 'temperature') + df_delta_multiplier*t_delta, None)}},
                      }
                    target:
                      entity_id: climate.office
                  - delay:
                      hours: 0
                      minutes: 0
                      seconds: 5
                      milliseconds: 0
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.df_conditions_set
                    alias: Enable boolean to indicate DF conditions are set
                    data: {}
                alias: Confirms single mode and appropriate DF season
        alias: Sets DF conditions
      - conditions:
          - condition: trigger
            id:
              - Occupant Overrides In App
              - df_event_ended
        sequence:
          - choose:
              - conditions:
                  - alias: >-
                      Confirms for UI restrictions, and not an On Device
                      override
                    condition: and
                    conditions:
                      - condition: state
                        entity_id:
                          - input_boolean.df_event_status
                          - input_boolean.climate_snapshot
                          - input_boolean.df_conditions_set
                        state: "on"
                      - condition: state
                        entity_id: input_boolean.smart_cities_set_point_changed_on_device
                        state: "off"
                sequence:
                  - choose:
                      - conditions:
                          - condition: not
                            conditions:
                              - condition: state
                                entity_id: input_text.smart_cities_snapshot_preset_mode
                                state: temp
                            alias: If Pre-DF climate conditions were on a schedule
                        sequence:
                          - action: ecobee.resume_program
                            metadata: {}
                            data:
                              entity_id: climate.office
                        alias: >-
                          Confirms if Pre-DF climate conditions were on a
                          schedule, resumes eocbee programs
                      - conditions:
                          - condition: state
                            entity_id: input_text.smart_cities_snapshot_preset_mode
                            state: temp
                        sequence:
                          - alias: Based on thermostat hvac_mode - set DF conditions
                            choose:
                              - conditions:
                                  - condition: state
                                    entity_id: climate.office
                                    state: heat_cool
                                    alias: Confirms Thermostat Dual HVAC mode
                                sequence:
                                  - action: climate.set_temperature
                                    metadata: {}
                                    data: |
                                      {
                                        "target_temp_high": {{ float(state_attr(snapshot_thermostat, 'target_temp_high'), None) }},
                                        "target_temp_low": {{ float(state_attr(snapshot_thermostat, 'target_temp_low'), None) }}
                                      }  
                                    target:
                                      entity_id: climate.office
                              - conditions:
                                  - condition: or
                                    conditions:
                                      - condition: state
                                        entity_id: climate.office
                                        state: cool
                                      - condition: state
                                        entity_id: climate.office
                                        state: heat
                                    alias: >-
                                      Confirms the Thermostat Uni HVAC mode -
                                      heating or cooling 
                                sequence:
                                  - action: climate.set_temperature
                                    metadata: {}
                                    data: |
                                      {
                                        "temperature": {{ float(state_attr(snapshot_thermostat, 'temperature'), None) }}
                                      }
                                    target:
                                      entity_id: climate.office
            alias: confirm end of event via calendar or in-app override
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.df_event_status
                - input_boolean.df_restriction_status
                - input_boolean.set_df_conditions
                - input_boolean.df_conditions_set
                - input_boolean.climate_snapshot
                - input_boolean.smart_cities_set_point_changed_on_device
            data: {}
            alias: turn off all DF event controlling booleans
        alias: >-
          InApp Override detected - reset to prior Climate conditions and turn
          off DF booleans
      - conditions:
          - condition: trigger
            id:
              - Occupant Overrides On Device
        sequence:
          - alias: Confirms on going DF event and turns it off
            choose:
              - conditions:
                  - condition: state
                    entity_id:
                      - input_boolean.df_event_status
                      - input_boolean.climate_snapshot
                      - input_boolean.df_restriction_status
                      - input_boolean.df_conditions_set
                    state: "on"
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id:
                        - input_boolean.df_event_status
                        - input_boolean.df_restriction_status
                        - input_boolean.set_df_conditions
                        - input_boolean.df_conditions_set
                        - input_boolean.climate_snapshot
                        - input_boolean.smart_cities_set_point_changed_on_device
                    data: {}
                    alias: turn off all DF event controlling booleans
        alias: On Deivce Override detected - turn off DF booleans
      - conditions:
          - condition: and
            conditions:
              - condition: trigger
                id:
                  - Occupant On Device Override - Target Temperature
                  - Occupant On Device Override - Target High Temp
                  - Occupant On Device Override - Target Low Temp
            alias: Checks if one of the three set point attribute have changes
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id:
                      - input_boolean.df_event_status
                      - input_boolean.climate_snapshot
                      - input_boolean.df_restriction_status
                      - input_boolean.df_conditions_set
                    state: "on"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.smart_cities_set_point_changed_on_device
                    data: {}
            alias: >-
              Confirms On going DF event and turns on the boolean for on device
              override
        alias: Detect set point changes when DF event is on
variables:
  df_calendar: calendar.nuhome_df_test
  real_thermostat: climate.office
  snapshot_thermostat: climate.smart_cities_snapshot_2
mode: parallel
trace:
  stored_traces: 50
